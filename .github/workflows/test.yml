---
  name: testing

  on:
    push:
      branches:
        - "**"
        - "!gh-pages"
        - "!main"

  jobs:
    test-chart:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v6.0.2
        - name: Start Minikube
          id: minikube
          uses: medyagh/setup-minikube@latest
        - name: Setup helm
          uses: azure/setup-helm@v5.0.0
          with:
            version: 'latest'
          id: install
        - name: Test charts
          run: ./test-charts.sh
        - name: Debug failure
          if: failure()
          run: ./debug-charts.sh
