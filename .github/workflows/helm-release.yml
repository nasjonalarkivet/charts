---
  name: Release Charts

  on:
    push:
      branches:
        - main
      paths:
        - 'helm/**'

  jobs:
    dispatch-release:
      if: github.actor != 'charts-release[bot]'
      permissions:
        contents: read
      runs-on: ubuntu-latest
      steps:
        - name: Create GitHub App token
          id: app-token
          uses: actions/create-github-app-token@v3
          with:
            client-id: ${{ vars.CHARTS_RELEASE_APP_CLIENT_ID }}
            private-key: ${{ secrets.CHARTS_RELEASE_APP_PRIVATE_KEY }}
            owner: nasjonalarkivet
            repositories: |
              charts-release

        - name: Dispatch charts-release workflow
          uses: peter-evans/repository-dispatch@v3
          with:
            token: ${{ steps.app-token.outputs.token }}
            repository: nasjonalarkivet/charts-release
            event-type: helm_release
            client-payload: >-
              {"repo":"${{ github.repository }}","ref":"${{ github.sha }}"}
